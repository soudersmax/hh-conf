<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Program Evaluation Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700&display=swap" rel="stylesheet">
</head>
<body>
    <h1 class="dashboard-title">Program Evaluation Dashboard</h1>
    <div class="dashboard-controls">
        <select class="dropdown" id="month-select">
            <option value="">Select Month</option>
        </select>
        <select class="dropdown" id="program-select">
            <option value="">Select Program Name</option>
        </select>
    </div>
    <div class="dashboard-stats">
        <div class="stat-square" id="stat1">Stat 1</div>
        <div class="stat-square" id="stat2">Stat 2</div>
        <div class="stat-square" id="stat3">Stat 3</div>
        <div class="stat-square" id="stat4">Stat 4</div>
    </div>
    <div class="intentions-row">
        <div id="intentionsBar"></div>
        <div id="top-3-intentions">Top 3 Intentions</div>
    </div>
    <div class="purchase-reasons-row">
        <div id="purchaseReasonBar"></div>
        <div id="top-3-purchase-reasons">Top 3 Purchase Reasons</div>
    </div>
    <div class="impacts-row">
        <div id="impactsBar"></div>
        <div id="top-3-impacts">Top 3 Impacts</div>
    </div>
<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="charts-d3.js"></script>
</body>
</html>
