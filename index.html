<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Program Evaluation Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700&display=swap" rel="stylesheet">
</head>
<body>
    <h1 class="dashboard-title">Program Evaluation Dashboard</h1>
    <div class="dashboard-controls">
        <select class="dropdown" id="month-select">
            <option value="">Select Month</option>
            <option value="January">January</option>
            <option value="February">February</option>
            <option value="March">March</option>
            <option value="April">April</option>
            <option value="May">May</option>
            <option value="June">June</option>
            <option value="July">July</option>
            <option value="August">August</option>
            <option value="September">September</option>
            <option value="October">October</option>
            <option value="November">November</option>
            <option value="December">December</option>
        </select>
        <select class="dropdown" id="program-select">
            <option value="">Select Program Name</option>
            <option value="Program A">Program A</option>
            <option value="Program B">Program B</option>
            <option value="Program C">Program C</option>
            <option value="Program D">Program D</option>
        </select>
    </div>
    <div class="dashboard-stats">
        <div class="stat-square" id="stat1">Stat 1</div>
        <div class="stat-square" id="stat2">Stat 2</div>
        <div class="stat-square" id="stat3">Stat 3</div>
        <div class="stat-square" id="stat4">Stat 4</div>
    </div>
</body>
</html>
